services:
  oracle-free:
    image: container-registry.oracle.com/database/free:latest
    container_name: progresssoft-oracle-free
    restart: unless-stopped
    ports:
      # Keep database listeners bound to this Windows host only.
      - "127.0.0.1:1521:1521"
      - "127.0.0.1:5500:5500"
    volumes:
      - oracle_data:/opt/oracle/oradata
    secrets:
      - oracle_pwd

secrets:
  oracle_pwd:
    file: ./secrets/oracle_pwd.txt

volumes:
  oracle_data:
